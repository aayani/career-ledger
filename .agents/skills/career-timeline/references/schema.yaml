$schema: https://json-schema.org/draft/2020-12/schema
$id: https://career-ledger.local/schema.yaml
title: Career
description: YAML representation of the career model.
type: object
additionalProperties: false
required:
  - person
  - location
  - education
  - employment
properties:
  person:
    $ref: "#/$defs/Person"
  location:
    $ref: "#/$defs/Location"
  education:
    type: array
    default: []
    uniqueItems: true
    description: Education history; may be empty when no education records are available.
    items:
      $ref: "#/$defs/Education"
  employment:
    type: array
    default: []
    uniqueItems: true
    description: Employment history; may be empty for students or people without work experience.
    items:
      $ref: "#/$defs/Employment"
  notes:
    type: array
    description: Optional free-form notes for career breaks and other information not represented elsewhere.
    items:
      type: string

$defs:
  City:
    type: object
    additionalProperties: false
    required:
      - name
      - country
    properties:
      name:
        type: string
        pattern: '\S'
        description: City name, or Online for remote education and work.
      country:
        type: string
        pattern: '\S'
        description: Country name, or Online when no physical country applies.

  Location:
    type: object
    additionalProperties: false
    required:
      - city
    properties:
      city:
        $ref: "#/$defs/City"

  Company:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
        pattern: '\S'
        description: Company name, or Personal for a personal project.
      location:
        $ref: "#/$defs/Location"

  Education:
    type: object
    additionalProperties: false
    allOf:
      - if:
          properties:
            type:
              enum: [certification, licence]
          required: [type]
        else:
          not:
            anyOf:
              - required: [credentialId]
              - required: [credentialUrl]
              - required: [expiryDate]
      - if:
          properties:
            type:
              enum: [degree, diploma]
          required: [type]
        else:
          not:
            required: [degree]
      - if:
          properties:
            type:
              enum: [degree, diploma, course, self-learning]
          required: [type]
        else:
          not:
            required: [fieldOfStudy]
    required:
      - city
      - type
      - startDate
    properties:
      private:
        type: boolean
        default: false
        description: Whether this education record is private and should not be disclosed.
      city:
        $ref: "#/$defs/City"
      type:
        type: string
        description: Education type provided by the user or interpreted by the LLM.
        enum:
          - certification
          - degree
          - diploma
          - course
          - licence
          - self-learning
      degree:
        type: string
        description: Degree level, such as Bachelor, Masters, or PhD.
      institution:
        type: string
        pattern: '\S'
        default: Other
        description: Institution name or certification issuer; interpreted as Other when omitted.
      fieldOfStudy:
        type: string
        description: Field of study, such as Computer Science or Humanities.
      credentialId:
        type: string
        description: Optional credential identifier for a certification or licence.
      credentialUrl:
        type: string
        format: uri
        pattern: '^https://[^\s]+$'
        description: Optional public HTTPS URL for a certification or licence.
      expiryDate:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        description: Optional expiry date for a certification or licence in YYYY-MM format; omit when it does not expire.
      startDate:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        description: Date in YYYY-MM format.
      endDate:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        description: End date in YYYY-MM format; omit for ongoing education.

  Language:
    type: object
    additionalProperties: false
    required:
      - name
      - proficiency
    properties:
      name:
        type: string
        pattern: '\S'
      proficiency:
        type: string
        enum:
          - beginner
          - professional
          - native

  Contact:
    type: object
    additionalProperties: false
    required:
      - phone
      - email
    properties:
      phone:
        type: string
        pattern: '^\+[1-9][0-9]{7,14}$'
        description: International phone number in E.164 format.
      email:
        type: string
        maxLength: 254
        pattern: "^[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$"
      github:
        type: string
        pattern: '^https://(?:www\.)?github\.com/[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?/?$'
      linkedin:
        type: string
        pattern: '^https://(?:(?:www|[a-z]{2})\.)?linkedin\.com/in/[A-Za-z0-9][A-Za-z0-9-]{1,98}[A-Za-z0-9]/?$'
      websites:
        type: array
        description: Optional portfolio or personal website URLs.
        uniqueItems: true
        items:
          type: string
          format: uri
          pattern: '^https://[^\s]+$'

  PersonName:
    type: object
    additionalProperties: false
    required:
      - first
    properties:
      first:
        type: string
        pattern: '\S'
      last:
        type: string
      middle:
        type: string

  Person:
    type: object
    additionalProperties: false
    required:
      - name
      - contact
    properties:
      name:
        $ref: "#/$defs/PersonName"
      contact:
        $ref: "#/$defs/Contact"
      languages:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/Language"

  WorkItem:
    type: object
    minProperties: 1
    additionalProperties: false
    required:
      - weightage
    allOf:
      - if:
          not:
            required: [name]
        then:
          required: [description]
          properties:
            description:
              pattern: '\S'
    anyOf:
      - required: [name]
      - required: [description]
      - required: [contribution]
      - required: [outcome]
      - required: [evidence]
      - required: [skills]
    properties:
      description:
        type: string
      contribution:
        type: string
        description: Optional description of the person's specific contribution to the work item.
      outcome:
        type: string
        description: Optional measured result or accurate qualitative change produced by the work.
      evidence:
        type: string
        description: Optional safe provenance or verification note supporting the work item.
      skills:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/Skill"
      name:
        type: string
        pattern: '\S'
        description: Optional project name provided by the user or interpreted by the LLM.
      weightage:
        type: integer
        minimum: 1
        maximum: 10
        default: 5
        description: Independent project relevance score from 1 to 10, calculated by the LLM; use 5 when it cannot be interpreted, and values do not need to total 10.

  Skill:
    type: object
    additionalProperties: false
    required:
      - id
      - name
    properties:
      private:
        type: boolean
        default: false
        description: Whether this skill usage is private and should not be disclosed.
      id:
        type: string
        pattern: "^skill-[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: Stable skill identity generated by the LLM; the same ID may appear in multiple project usages as the skill evolves.
      name:
        type: string
        pattern: '\S'
        description: Skill name repeated in each project usage for local readability.
      proficiency:
        type: string
        description: Optional contextual proficiency for this project usage, interpreted by the LLM from the experience described.
        enum:
          - beginner
          - intermediate
          - advanced

  Employment:
    type: object
    additionalProperties: false
    required:
      - id
      - jobTitle
      - company
      - type
      - projects
      - startDate
      - endDate
    properties:
      private:
        type: boolean
        default: false
        description: Whether this employment record is private and should not be disclosed.
      id:
        type: string
        pattern: "^employment-[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: Stable employment identifier generated by the LLM.
      jobTitle:
        type: string
        pattern: '\S'
      jobDescription:
        type: string
      company:
        $ref: "#/$defs/Company"
      type:
        type: string
        enum:
          - permanent
          - part-time
          - contract
          - internship
          - freelance
          - temporary
          - volunteer
          - self-employed
          - apprenticeship
          - other
      projects:
        type: array
        default: []
        description: Projects or recurring work items; may be empty when only the job description is known.
        uniqueItems: true
        items:
          $ref: "#/$defs/WorkItem"
      startDate:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        description: Date in YYYY-MM format.
      endDate:
        oneOf:
          - const: present
          - type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        description: The value present or a date in YYYY-MM format.
